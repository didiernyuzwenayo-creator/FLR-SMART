<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174d38"><title>FLR SMART | Field & Learning Assistant</title>
<style>
:root{--green:#174d38;--green2:#236b4c;--lime:#d9edc4;--bg:#f4f7f2;--ink:#1d2b24;--muted:#6d7b72;--line:#e2e9e2;--white:#fff;--orange:#d98a32;--shadow:0 10px 28px #173e2610}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--green);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.brandmark{width:40px;height:40px;border-radius:13px;background:#d9edc4;color:var(--green);display:grid;place-items:center;font-size:23px}.brand strong{display:block;font-size:18px;letter-spacing:.4px}.brand small{color:#c3d8c9}.navlabel{color:#a9c8b4;text-transform:uppercase;font-size:10px;letter-spacing:1.5px;padding:0 12px;margin-bottom:6px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#e0eee4;text-align:left;padding:11px 12px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#ffffff1c;color:#fff}.nav .ico{width:20px;text-align:center}.sidefoot{margin-top:auto;padding:14px 10px;color:#c2d8ca;font-size:12px;border-top:1px solid #ffffff26}.main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:3}.crumb{font-weight:650}.top-actions{display:flex;gap:10px;align-items:center}.pill{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:10px;color:var(--ink)}.userdot{width:34px;height:34px;background:var(--lime);color:var(--green);display:grid;place-items:center;border-radius:50%;font-weight:700}.content{padding:30px;max-width:1400px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.eyebrow{color:var(--green2);font-size:12px;font-weight:750;letter-spacing:1px;text-transform:uppercase}.welcome h1{font-size:29px;line-height:1.2;margin:7px 0}.welcome p{color:var(--muted);margin:0}.primary{border:0;background:var(--green2);color:#fff;border-radius:10px;padding:11px 16px;font-weight:650}.primary:hover{background:var(--green)}.secondary{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;color:var(--ink)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.card,.stat{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:17px}.stathead{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.staticon{width:34px;height:34px;border-radius:10px;background:#edf5e8;display:grid;place-items:center;font-size:17px}.stat strong{display:block;font-size:27px;margin:9px 0 1px}.stat small{color:var(--muted)}.grid2{display:grid;grid-template-columns:1.25fr .85fr;gap:17px}.card{padding:20px;margin-bottom:17px}.card h2{font-size:17px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 17px}.quickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;text-align:left;color:var(--ink)}.quick:hover{border-color:#9fc5a8;background:#f8fbf6}.quick b{display:block;margin:8px 0 2px}.quick small{color:var(--muted)}.quick .bigico{font-size:22px}.activity{display:grid;gap:0}.activityrow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.activityrow:first-child{border-top:0}.activityrow small{display:block;color:var(--muted)}.badge{display:inline-flex;align-items:center;border-radius:99px;background:#edf5e8;color:var(--green2);padding:4px 9px;font-size:11px;font-weight:700}.badge.warn{background:#fff4e4;color:#98601c}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.sectionhead h1{font-size:26px;margin:0}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:700;color:#526258}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #dce5dc;border-radius:9px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#72a681;box-shadow:0 0 0 3px #d9edc477}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 13px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:11px;border-bottom:1px solid var(--line)}td{padding:12px 11px;border-bottom:1px solid #edf1ed}tr:last-child td{border-bottom:0}.lessonlist{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.lesson{border:1px solid var(--line);border-radius:13px;padding:17px;background:#fff}.lesson .tag{font-size:11px;color:var(--green2);font-weight:750}.lesson h3{margin:6px 0;font-size:16px}.lesson p{font-size:13px;color:var(--muted);margin:0 0 12px}.progress{height:6px;background:#edf1ed;border-radius:99px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:#5d9b69}.lessonbody{max-width:850px}.lessonbody h2{margin-top:22px}.notice{background:#f0f6eb;border-left:4px solid #79a96e;padding:12px 14px;border-radius:7px;font-size:13px;margin:15px 0}.result{background:#f2f7ee;border:1px solid #dcebd4;border-radius:12px;padding:15px;margin-top:13px}.result strong{font-size:23px;color:var(--green)}.empty{padding:25px;text-align:center;color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:#193e2d;color:white;padding:12px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:10}.mobilemenu{display:none}
@media(max-width:950px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:5;inset:0 auto 0 0;width:260px;transform:translateX(-105%);transition:.2s}.sidebar.open{transform:translateX(0)}.mobilemenu{display:inline-flex}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.topbar{padding:0 17px}.content{padding:22px 17px}}
@media(max-width:600px){.welcome{display:block}.welcome .primary{margin-top:15px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.quickgrid,.lessonlist,.formgrid{grid-template-columns:1fr}.sectionhead{align-items:flex-start;gap:12px;flex-direction:column}.topbar{height:62px}}
</style></head>
<body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">🌿</div><div><strong>FLR SMART</strong><small>Learn • Manage • Restore</small></div></div>
<div><div class="navlabel">Workspace</div><nav class="nav" id="nav">
<button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
<button data-page="learning"><span class="ico">📚</span>Learning Center</button>
<button data-page="farmers"><span class="ico">👩🏽‍🌾</span>Farmer Records</button>
<button data-page="distribution"><span class="ico">🌱</span>Tree Distribution</button>
<button data-page="survey"><span class="ico">🌳</span>Planting Survey</button>
<button data-page="reports"><span class="ico">📊</span>Field Reports</button>
<button data-page="calculator"><span class="ico">🧮</span>Field Calculator</button>
</nav></div><div class="sidefoot">Prototype v1.0 · Demo data only<br>Not an official Tubura system</div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="secondary mobilemenu" id="menuBtn">☰</button><span class="crumb" id="crumb">Dashboard</span></div><div class="top-actions"><button class="pill" id="langBtn">Kinyarwanda</button><div class="userdot">FO</div></div></header><div class="content" id="content"></div></main></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);const content=$('#content');let lang='en';let farmers=JSON.parse(localStorage.getItem('flr_farmers')||'[]');let surveys=JSON.parse(localStorage.getItem('flr_surveys')||'[]');let reports=JSON.parse(localStorage.getItem('flr_reports')||'[]');let page='dashboard';
const demoFarmers=[{name:'Demo Farmer A',village:'Sample Village',group:'Karongi Itoshye',pkg:'Contour',allocated:100,planted:85},{name:'Demo Farmer B',village:'Sample Village',group:'Inshuti z’Igiti',pkg:'Boundary',allocated:80,planted:72},{name:'Demo Farmer C',village:'Sample Village',group:'Abarinzi z’Igiti',pkg:'Intercropping',allocated:120,planted:0}];
function allFarmers(){return [...demoFarmers,...farmers]}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2400)}
function go(p){page=p;$('#sidebar').classList.remove('open');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#crumb').textContent=({dashboard:'Dashboard',learning:'Learning Center',farmers:'Farmer Records',distribution:'Tree Distribution',survey:'Planting Survey',reports:'Field Reports',calculator:'Field Calculator'})[p];render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#langBtn').onclick=()=>{lang=lang==='en'?'rw':'en';$('#langBtn').textContent=lang==='en'?'Kinyarwanda':'English';render()};
const rw=()=>lang==='rw';
function dashboard(){let f=allFarmers(),allocated=f.reduce((a,x)=>a+(+x.allocated||0),0),planted=f.reduce((a,x)=>a+(+x.planted||0),0);return `<div class="welcome"><div><div class="eyebrow">Field & Learning Assistant</div><h1>${rw()?'Murakaza neza kuri FLR SMART':'Welcome to FLR SMART'}</h1><p>${rw()?'Ibikoresho bigufasha kwiga no koroshya imirimo yo mu murima.':'Practical tools to support FLR learning and field operations.'}</p></div><button class="primary" onclick="go('learning')">${rw()?'Tangira kwiga':'Start learning'} →</button></div>
<div class="stats"><div class="stat"><div class="stathead">Farmers in demo records <span class="staticon">👩🏽‍🌾</span></div><strong>${f.length}</strong><small>Includes sample records</small></div><div class="stat"><div class="stathead">Trees allocated <span class="staticon">🌱</span></div><strong>${allocated.toLocaleString()}</strong><small>Demo + locally entered data</small></div><div class="stat"><div class="stathead">Trees planted <span class="staticon">🌳</span></div><strong>${planted.toLocaleString()}</strong><small>Survey entries</small></div><div class="stat"><div class="stathead">Planting rate <span class="staticon">📈</span></div><strong>${allocated?Math.round(planted/allocated*100):0}%</strong><small>Based on displayed records</small></div></div>
<div class="grid2"><section class="card"><h2>Quick actions</h2><p class="sub">Choose a tool to get started.</p><div class="quickgrid"><button class="quick" onclick="go('farmers')"><span class="bigico">👩🏽‍🌾</span><b>Register farmer</b><small>Add a demo farmer record</small></button><button class="quick" onclick="go('survey')"><span class="bigico">🌳</span><b>Planting survey</b><small>Record planted trees</small></button><button class="quick" onclick="go('reports')"><span class="bigico">📋</span><b>Create report</b><small>Summarize field activities</small></button><button class="quick" onclick="go('calculator')"><span class="bigico">🧮</span><b>Spacing calculator</b><small>Estimate planting points</small></button><button class="quick" onclick="go('distribution')"><span class="bigico">🌱</span><b>Distribution</b><small>Review allocations</small></button><button class="quick" onclick="go('learning')"><span class="bigico">📚</span><b>Learn FLR</b><small>Open technical lessons</small></button></div></section><section class="card"><h2>Learning progress</h2><p class="sub">Your learning pathway</p><div class="activity"><div class="activityrow"><div>Introduction to FLR<small>Foundation lesson</small></div><span class="badge">Available</span></div><div class="activityrow"><div>FLR packages<small>Contour, boundary, intercropping</small></div><span class="badge">Available</span></div><div class="activityrow"><div>Planting survey<small>Field monitoring</small></div><span class="badge warn">Coming next</span></div></div><div class="notice">Technical spacing and package standards must be confirmed against your current approved FLR guidelines before field use.</div></section></div>`}
const lessons=[['Introduction to FLR','Understand landscape restoration, its purpose and benefits.','Foundation','FLR is the process of supporting the recovery of degraded landscapes while improving ecological functions and human well-being. It may include natural regeneration, tree planting, soil and water conservation, and sustainable land management.','A Field Officer helps farmers understand the purpose of activities, supports implementation and records progress accurately.'],['Understanding FLR packages','Learn how to recognize the packages used in your project.','Technical','A package is a defined set of land-use or planting practices. The exact design, species, spacing and eligibility rules must come from the current approved project guidance.','Do not assume that one spacing rule applies to every site. Confirm package-specific instructions before advising farmers.'],['Land preparation','Prepare the site safely and according to the approved design.','Field practice','Before planting, confirm the site, boundaries, land preparation requirements, access and any soil or water conservation measures required for the selected package.','Record constraints early and raise questions when field conditions differ from the plan.'],['Tree distribution','Keep clear records of seedlings allocated and received.','Operations','A good distribution record connects the farmer, group, species, quantity, date and confirmation of receipt. Reconcile issued quantities with stock and approved distribution lists.','Use the authorized distribution card as the source of truth; do not invent missing quantities.'],['Tree planting','Support correct planting and early care.','Field practice','Planting quality depends on healthy seedlings, suitable timing, correct handling, prepared planting points and aftercare. Follow species-specific and project-approved instructions.','Check that seedlings are planted, stable and protected, and explain aftercare to farmers.'],['Planting survey','Compare seedlings received with seedlings planted.','Monitoring','A planting survey records the number received, number planted, number remaining, survey date and any reason for a gap. It should be traceable to the farmer and distribution record.','Example: 100 received, 85 planted, 15 remaining. Planting rate = 85%. This is sample data only.'],['Tree survival monitoring','Track survival and identify where support is needed.','Monitoring','Survival monitoring checks whether planted trees remain alive after planting. Record the survey date, number checked, number alive, number dead and likely causes where known.','Use consistent monitoring periods and the indicators defined by the project.']];
function learning(){return `<div class="sectionhead"><div><div class="eyebrow">Knowledge hub</div><h1>FLR Learning Center</h1><p class="sub">Short practical lessons for field implementation.</p></div><span class="badge">${lessons.length} lessons</span></div><div class="lessonlist">${lessons.map((l,i)=>`<article class="lesson"><div class="tag">LESSON ${i+1} · ${l[2]}</div><h3>${l[0]}</h3><p>${l[1]}</p><div class="progress"><span style="width:${i===0?100:0}%"></span></div><button class="secondary" onclick="openLesson(${i})">Open lesson →</button></article>`).join('')}</div>`}
function openLesson(i){let l=lessons[i];content.innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Learning Center / Lesson ${i+1}</div><h1>${l[0]}</h1></div><button class="secondary" onclick="go('learning')">← All lessons</button></div><article class="card lessonbody"><span class="badge">${l[2]}</span><h2>Learning objective</h2><p>${l[1]}</p><h2>Key concept</h2><p>${l[3]}</p><h2>Field application</h2><p>${l[4]}</p><div class="notice"><b>Important:</b> This is introductory learning content. Always follow the latest approved project SOPs, species guidance and supervisor instructions for operational decisions.</div><h2>Quick knowledge check</h2><p>Which is the best practice when project-specific spacing or package details are unclear?</p><label style="display:block;margin:9px 0"><input type="radio" name="q" value="a"> Guess based on another package</label><label style="display:block;margin:9px 0"><input type="radio" name="q" value="b"> Confirm using approved project guidance</label><label style="display:block;margin:9px 0"><input type="radio" name="q" value="c"> Skip recording the information</label><button class="primary" onclick="checkQuiz()">Check answer</button><div id="quizresult"></div></article>`;window.scrollTo(0,0)}
function checkQuiz(){let v=document.querySelector('input[name=q]:checked');$('#quizresult').innerHTML=v?`<div class="result">${v.value==='b'?'Correct! Always verify with approved guidance.':'Not quite. The correct answer is to confirm using approved project guidance.'}</div>`:'<p class="sub">Please select an answer.</p>'}
function farmersPage(){let f=allFarmers();return `<div class="sectionhead"><div><div class="eyebrow">Field records</div><h1>Farmer Management</h1><p class="sub">Add and review sample farmer records. Saved on this device only.</p></div></div><div class="grid2"><section class="card"><h2>Register farmer</h2><p class="sub">Use fictional data for this prototype.</p><form id="farmerForm"><div class="field"><label>Farmer name</label><input name="name" required placeholder="Example: Farmer D"></div><div class="formgrid"><div class="field"><label>Village</label><input name="village" required></div><div class="field"><label>Group</label><select name="group"><option>Karongi Itoshye</option><option>Inshuti z’Igiti</option><option>Abarinzi z’Igiti</option><option>Intumwa z’Isi Itoshye</option></select></div><div class="field"><label>FLR package</label><select name="pkg"><option>Contour</option><option>Boundary</option><option>Intercropping</option><option>To confirm</option></select></div><div class="field"><label>Trees allocated</label><input name="allocated" type="number" min="0" value="0"></div></div><button class="primary">Save farmer</button></form></section><section class="card"><h2>Data protection</h2><p class="sub">Prototype storage notice</p><div class="notice">Records entered here are stored in this browser's local storage. They are not uploaded to a server, backed up or shared with a supervisor.</div><p style="font-size:13px;color:var(--muted)">Do not enter real farmer names, phone numbers, IDs or confidential project information until an authorized secure system and data permissions are in place.</p></section></div><section class="card"><h2>Farmer records (${f.length})</h2><div class="tablewrap"><table><thead><tr><th>Farmer</th><th>Village</th><th>Group</th><th>Package</th><th>Allocated</th></tr></thead><tbody>${f.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.village)}</td><td>${esc(x.group)}</td><td>${esc(x.pkg)}</td><td>${x.allocated}</td></tr>`).join('')}</tbody></table></div></section>`}
function distribution(){let f=allFarmers();return `<div class="sectionhead"><div><div class="eyebrow">Seedling operations</div><h1>Tree Distribution Tracker</h1><p class="sub">Review allocations recorded in the sample dataset.</p></div><button class="secondary" onclick="go('farmers')">+ Add farmer</button></div><section class="card"><div class="notice">Use the approved distribution card as the authoritative record. This screen currently shows sample records plus entries created in this browser.</div><div class="tablewrap"><table><thead><tr><th>Farmer</th><th>Group</th><th>Package</th><th>Allocated</th><th>Planted (survey)</th><th>Remaining*</th></tr></thead><tbody>${f.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.group)}</td><td>${esc(x.pkg)}</td><td>${x.allocated}</td><td>${x.planted||0}</td><td>${Math.max(0,(+x.allocated||0)-(+x.planted||0))}</td></tr>`).join('')}</tbody></table></div><p class="sub">*Remaining is a simple estimate (allocated minus planted); it is not a verified stock balance.</p></section>`}
function survey(){let f=allFarmers();return `<div class="sectionhead"><div><div class="eyebrow">Monitoring</div><h1>Planting Survey</h1><p class="sub">Record seedlings received and planted.</p></div></div><div class="grid2"><section class="card"><h2>New survey entry</h2><form id="surveyForm"><div class="field"><label>Farmer</label><select name="farmer">${f.map((x,i)=>`<option value="${i}">${esc(x.name)} — ${esc(x.group)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Trees received</label><input name="received" type="number" min="0" required></div><div class="field"><label>Trees planted</label><input name="planted" type="number" min="0" required></div><div class="field"><label>Survey date</label><input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Remaining seedlings</label><input name="remaining" type="number" min="0" value="0"></div></div><div class="field"><label>Comments / reasons for gap</label><textarea name="notes" rows="3" placeholder="Optional"></textarea></div><button class="primary">Save survey</button></form></section><section class="card"><h2>Survey guidance</h2><div class="notice">Check that planted quantity does not exceed received quantity. If numbers do not reconcile, verify the distribution record before submitting.</div><p style="font-size:13px;color:var(--muted)">Planting rate = trees planted ÷ trees received × 100. This is not the same as tree survival rate, which is measured later.</p></section></div><section class="card"><h2>Recent survey entries</h2>${surveys.length?`<div class="tablewrap"><table><thead><tr><th>Farmer</th><th>Date</th><th>Received</th><th>Planted</th><th>Rate</th></tr></thead><tbody>${surveys.map(s=>`<tr><td>${esc(s.farmer)}</td><td>${s.date}</td><td>${s.received}</td><td>${s.planted}</td><td>${s.received?Math.round(s.planted/s.received*100):0}%</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No survey entries yet.</div>'}</section>`}
function reportsPage(){return `<div class="sectionhead"><div><div class="eyebrow">Field documentation</div><h1>Daily Field Report</h1><p class="sub">Create a simple activity summary from your field visit.</p></div></div><div class="grid2"><section class="card"><h2>Report details</h2><form id="reportForm"><div class="formgrid"><div class="field"><label>Report date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Group / team</label><select name="group"><option>Karongi Itoshye</option><option>Inshuti z’Igiti</option><option>Abarinzi z’Igiti</option><option>Intumwa z’Isi Itoshye</option></select></div><div class="field"><label>Activity</label><select name="activity"><option>Farmer training</option><option>Land preparation follow-up</option><option>Tree distribution</option><option>Planting follow-up</option><option>Planting survey</option><option>Other</option></select></div><div class="field"><label>Participants</label><input name="participants" type="number" min="0" value="0"></div></div><div class="field"><label>Activities completed</label><textarea name="completed" rows="3" required></textarea></div><div class="field"><label>Challenges / comments</label><textarea name="challenges" rows="3"></textarea></div><div class="field"><label>Next steps</label><textarea name="next" rows="2"></textarea></div><button class="primary">Save report</button></form></section><section class="card"><h2>Saved reports</h2><p class="sub">Reports are stored in this browser only.</p>${reports.length?reports.slice().reverse().map(r=>`<div class="activityrow"><div><b>${esc(r.activity)}</b><small>${r.date} · ${esc(r.group)} · ${r.participants} participants</small></div><button class="secondary" onclick="viewReport(${reports.indexOf(r)})">View</button></div>`).join(''):'<div class="empty">No reports saved yet.</div>'}<button class="secondary" onclick="exportReports()" ${reports.length?'':'disabled'}>Export reports as CSV</button></section></div><div id="reportPreview"></div>`}
function viewReport(i){let r=reports[i];$('#reportPreview').innerHTML=`<section class="card"><h2>Report preview</h2><p><b>${esc(r.activity)}</b> · ${r.date} · ${esc(r.group)}</p><p>Participants: ${r.participants}</p><p><b>Completed:</b> ${esc(r.completed)}</p><p><b>Challenges:</b> ${esc(r.challenges||'—')}</p><p><b>Next steps:</b> ${esc(r.next||'—')}</p><button class="secondary" onclick="window.print()">Print / Save PDF</button></section>`}
function calculator(){return `<div class="sectionhead"><div><div class="eyebrow">Field tools</div><h1>Field Calculator</h1><p class="sub">Simple estimates. Confirm technical standards before using in the field.</p></div></div><div class="grid2"><section class="card"><h2>Planting point estimate</h2><p class="sub">Estimate planting points on a rectangular plot using a simple grid.</p><form id="calcForm"><div class="formgrid"><div class="field"><label>Plot length (metres)</label><input name="length" type="number" min="0.1" step="0.1" required placeholder="e.g. 60"></div><div class="field"><label>Plot width (metres)</label><input name="width" type="number" min="0.1" step="0.1" required placeholder="e.g. 30"></div><div class="field"><label>Row spacing (metres)</label><input name="row" type="number" min="0.1" step="0.1" required placeholder="e.g. 6"></div><div class="field"><label>Within-row spacing (metres)</label><input name="within" type="number" min="0.1" step="0.1" required placeholder="e.g. 6"></div></div><button class="primary">Calculate estimate</button></form><div id="calcResult"></div></section><section class="card"><h2>How to interpret</h2><div class="notice">This calculator estimates a regular grid using plot area ÷ spacing area. Actual planting points can differ because of plot shape, boundaries, slope, access paths, package design and exclusions.</div><p style="font-size:13px;color:var(--muted)">Do not treat this estimate as an official seedling allocation. Use approved package specifications and field measurements.</p></section></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){content.innerHTML=({dashboard,learning,farmers:farmersPage,distribution,survey,reports:reportsPage,calculator})[page]();bindForms()}
function bindForms(){let ff=$('#farmerForm');if(ff)ff.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(ff));d.allocated=+d.allocated;d.planted=0;farmers.push(d);localStorage.setItem('flr_farmers',JSON.stringify(farmers));toast('Farmer record saved on this device');render()};let sf=$('#surveyForm');if(sf)sf.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(sf)),f=allFarmers()[+d.farmer];d.received=+d.received;d.planted=+d.planted;d.remaining=+d.remaining;if(d.planted>d.received){toast('Planted quantity cannot exceed received quantity');return}if(d.remaining>d.received-d.planted){toast('Remaining quantity looks higher than the balance');return}d.farmer=f.name;surveys.push(d);localStorage.setItem('flr_surveys',JSON.stringify(surveys));toast('Survey saved');render()};let rf=$('#reportForm');if(rf)rf.onsubmit=e=>{e.preventDefault();reports.push(Object.fromEntries(new FormData(rf)));localStorage.setItem('flr_reports',JSON.stringify(reports));toast('Report saved');render()};let cf=$('#calcForm');if(cf)cf.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(cf)),area=+d.length*+d.width,per=+d.row*+d.within,est=Math.floor(area/per);$('#calcResult').innerHTML=`<div class="result"><small>Estimated planting points</small><br><strong>${est.toLocaleString()}</strong><p class="sub">Plot area: ${area.toLocaleString()} m² · Grid area per point: ${per} m²</p></div>`}}
function exportReports(){let rows=[['Date','Group','Activity','Participants','Completed','Challenges','Next steps'],...reports.map(r=>[r.date,r.group,r.activity,r.participants,r.completed,r.challenges,r.next])];let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='flr-field-reports.csv';a.click();URL.revokeObjectURL(a.href)}
render();
</script></body></html>
